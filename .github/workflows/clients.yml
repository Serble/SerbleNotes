name: Clients

# Builds the desktop and Android clients, and optionally releases them.
#
# The Windows installer is the reason this exists: Tauri has no supported way to cross-compile a
# Windows app from Linux, so a Windows runner is how a Windows build gets made without owning a
# Windows machine. Linux and Android build fine locally; they are here so a release produces all of
# them at once, from the same commit.
#
# No `push: tags` trigger: the version lives in tauri.conf.json, because that is where Android's
# versionCode comes from, so a hand-written tag is a second copy of it that can disagree.
#
# VITE_API_BASE_URL has to be set as a repository variable: a packaged app is not served by the
# backend, so it has nowhere to look for it, and `platform.ts` has no runtime fallback - a build
# without it shows "this build is incomplete" on the sign-in screen. The Serble application id comes
# from that server once the app can reach it, so there is nothing else to configure for a build.
#
# Publishing to Google Play needs four secrets for the signing key and one for the API, all listed
# under "Releasing" in CLAUDE.md. Without them this workflow still builds - it falls back to the
# debug APK it built before there was a key - so a fork, or a clone with no secrets set, is not a
# workflow that fails.
#
# Play goes no further than the track chosen here, and `internal` is the default. Promoting a build
# to production stays a decision somebody makes in the Play Console, in front of the release notes
# and the rollout percentage.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create a GitHub release, tagged with the version in tauri.conf.json
        type: boolean
        default: false
      publish:
        description: Publish to Google Play as well
        type: boolean
        default: false
      track:
        description: Which Play track (ignored unless publishing)
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

jobs:
  preflight:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # Play never forgets a versionCode, so a version released once can never be released again.
      # Finding that out here costs a minute; finding it out after the build costs an hour.
      - name: Read the version
        id: version
        working-directory: SerbleNotes.App/src-tauri
        env:
          RELEASING: ${{ inputs.release }}
          PUBLISHING: ${{ inputs.publish }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('tauri.conf.json'))['version'])")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tauri.conf.json says $version, so the tag is $tag."

          if [ "$RELEASING" != "true" ] && [ "$PUBLISHING" != "true" ]; then
            echo "Building only - nothing will be tagged or uploaded."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists, so $version has been released before."
            echo "::error::Bump the version in SerbleNotes.App/src-tauri/tauri.conf.json, commit and push, then run this again."
            exit 1
          fi
          echo "$tag is free."

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SerbleNotes.App/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SerbleNotes.App/src-tauri

      # webkit2gtk is the webview, libsoup is its HTTP stack, and librsvg is what the AppImage
      # bundler renders the icon with. Ubuntu 22.04 rather than latest because the glibc an AppImage
      # is built against is the oldest one it will run on.
      #
      # The tray icon library is libayatana-appindicator3-dev and only that one. Tauri v1's
      # dependency list named libappindicator3-dev, the two Conflict: with each other in apt, and
      # asking for both fails the whole install with "you have held broken packages" - which reads
      # like a broken runner rather than a line naming two versions of one thing.
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential \
            curl wget file libssl-dev libgtk-3-dev

      - name: Install dependencies
        working-directory: SerbleNotes.App
        run: npm ci

      - name: Build
        working-directory: SerbleNotes.App
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            SerbleNotes.App/src-tauri/target/release/bundle/**/*.AppImage
            SerbleNotes.App/src-tauri/target/release/bundle/**/*.deb
            SerbleNotes.App/src-tauri/target/release/bundle/**/*.rpm
            SerbleNotes.App/src-tauri/target/release/bundle/**/*.msi
            SerbleNotes.App/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  android:
    name: Android
    needs: preflight
    runs-on: ubuntu-latest

    # The `secrets` context cannot be read from an `if`, so whether each half of the release is
    # configured is decided once, here, and the steps below test the result. Neither value is the
    # secret itself.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SerbleNotes.App/package-lock.json

      # The Android Gradle Plugin follows the JDK releases some way behind, so this is pinned rather
      # than taking whatever the runner ships.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager --install "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SerbleNotes.App/src-tauri

      - name: Install dependencies
        working-directory: SerbleNotes.App
        run: npm ci

      # Written where the template's own .gitignore already expects a key, so nothing here can be
      # committed by accident. The file is Java's .properties format, in which a backslash escapes
      # the character after it - so one in a password would be silently eaten and the build would
      # fail with nothing worse than "wrong password". Doubling them is what keeps that honest.
      - name: Write the signing key
        if: env.HAS_KEYSTORE == 'true'
        working-directory: SerbleNotes.App/src-tauri/gen/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > upload-keystore.jks
          if [ ! -s upload-keystore.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to anything. Re-run base64 -w0 on the .jks."
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$PWD/upload-keystore.jks"
            printf 'password=%s\n' "${STORE_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
            # Omitted rather than written empty when the secret is unset: the Gradle config falls
            # back to the store password only when the property is *absent*, and a modern keytool
            # cannot give a PKCS12 keystore a separate key password anyway - it says so and ignores
            # the request. An empty line here would be used as the password and fail the build.
            if [ -n "$KEY_PASSWORD" ]; then
              printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
            fi
          } > keystore.properties

      # An AAB is what Play takes; the APK is for people who install it themselves, and is the same
      # build signed the same way. Both come out of one invocation, which matters because the Rust
      # core is compiled for four architectures and doing that twice is most of the job's runtime.
      - name: Build a signed release
        if: env.HAS_KEYSTORE == 'true'
        working-directory: SerbleNotes.App
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npx tauri android build --aab --apk

      # No key configured, so a release build would come out unsigned - which Play refuses and a
      # phone will not install. A debug APK is the thing that is actually usable in that situation,
      # and it is what this workflow produced before any of this existed.
      - name: Build a debug APK
        if: env.HAS_KEYSTORE != 'true'
        working-directory: SerbleNotes.App
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npx tauri android build --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            SerbleNotes.App/src-tauri/gen/android/app/build/outputs/**/*.apk
            SerbleNotes.App/src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error

      # The key never leaves the runner, but the runner is not ours and the build is over: there is
      # nothing left that needs it, so there is no reason for it to still be on disk.
      - name: Shred the signing key
        if: always() && env.HAS_KEYSTORE == 'true'
        working-directory: SerbleNotes.App/src-tauri/gen/android
        run: rm -f upload-keystore.jks keystore.properties

      # The mapping file goes up with it because the release build is minified: without it every
      # crash report from a real phone is a stack of obfuscated names.
      - name: Publish to Google Play
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY_KEY == 'true' && inputs.publish
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.serble.notes
          releaseFiles: SerbleNotes.App/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          mappingFile: SerbleNotes.App/src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt
          track: ${{ inputs.track }}
          status: completed

  # Creating the release is what creates the tag, at the commit this run built - so a tag never names
  # a commit whose Windows build failed.
  release:
    name: GitHub release
    needs: [preflight, desktop, android]
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Android only: the desktop bundles stay run artifacts for now. Dropping the `name` ships them
      # too, because the step below takes whatever it is given.
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: artifacts

      # Flattened and de-spaced, minus the AAB, which is what Play takes and what no phone can
      # install. The APK is renamed because Tauri names it after a Gradle flavour rather than the
      # product, and `app-universal-release.apk` says nothing in somebody's downloads folder.
      - name: Collect the installers
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p release

          apk=$(find artifacts -name '*.apk' -path '*universal*' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No universal APK in the Android artifact."
            exit 1
          fi
          cp "$apk" "release/Serble.Notes_${VERSION}_android-universal.apk"

          find artifacts -type f ! -name '*.apk' ! -name '*.aab' -print0 |
            while IFS= read -r -d '' file; do
              cp "$file" "release/$(basename "$file" | tr ' ' '.')"
            done

          ls -la release

      # On the page where somebody is about to download the wrong one of the two.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install

          **Android** - \`Serble.Notes_${VERSION}_android-universal.apk\`. One file, every
          architecture. Point [Obtainium](https://github.com/ImranR98/Obtainium) at this repository
          to be told when there is a new one.

          The Play Store build is signed by Google and this one is signed by us, so Android treats
          them as different apps and will not install either over the other. Moving between them
          means uninstalling first: your notes are on the server, but the device forgets your vault
          key and will ask for the vault password again.

          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Serble Notes ${{ needs.preflight.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
