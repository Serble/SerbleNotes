[package]
name = "serblenotes-core"
version = "0.1.0"
edition = "2021"
description = "Shared crypto and version control for every Serble Notes client"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
blake2 = "0.10.6"
chacha20poly1305 = "0.10"
diffy = "0.4"
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
proptest = "1.11.0"
